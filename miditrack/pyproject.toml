[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "miditrack"
dynamic = ["version"]
description = "Assign a General MIDI instrument per track and audition the result"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nihondo"}]
dependencies = [
  "mido>=1.3,<2",
  "Flask==3.1.3",
]

[project.optional-dependencies]
build = [
  "PyInstaller==6.16.0",
]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
miditrack = "miditrack.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "miditrack.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
miditrack = ["web_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
